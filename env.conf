# ─── ENVIRONMENT ───────────────────────────────────────────
# Sourced first in hyprland.conf — env must be set before anything launches.

# ── GPU: render on the NVIDIA RTX 3050 (card0) ─────────────
# Intel UHD (card1) still scans out to the eDP-1 laptop panel via multi-GPU copy;
# NVIDIA stays primary renderer and keeps driving HDMI-A-1.
# Rollback: comment out the AQ_DRM_DEVICES line below and log out/in.
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1   # NVIDIA first = primary renderer
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct                             # NVDEC/VAAPI video decode on dGPU

# ── Wayland-native toolkits (fewer XWayland copies, better scaling) ──
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1
env = _JAVA_AWT_WM_NONREPARENTING,1

# ── Cursor fallback ────────────────────────────────────────
# If the cursor flickers/disappears on NVIDIA, uncomment:
# cursor {
#     no_hardware_cursors = true
# }
