# ─── MODIFIER KEY ──────────────────────────────
$mainMod = SUPER

# ─── LAUNCHING APPLICATIONS ────────────────────
$terminal = kitty
$menu = wofi --show drun
$fileManager = thunar
$screenshot = grimblast save area ~/Pictures/screenshot/$(date +'%Y-%m-%d_%H-%M-%S_grim.png')
$browser = firefox

bind = $mainMod, T, exec, $terminal
bind = $mainMod, R, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, S, exec, $screenshot
bind = $mainMod, W, exec, eww open-all
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, N, exec, swaync-client -d

# ─── WINDOW MANAGEMENT ─────────────────────────
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, P, togglefloating
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, M, exit
bind = $mainMod, Space, togglefloating

# Hold SUPER + Left mouse button = move window
bindm = SUPER, mouse:272, movewindow
# Hold SUPER + Right mouse button = resize window
bindm = SUPER, mouse:273, resizewindow

# ─── WINDOW FOCUS ──────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ─── WINDOW MOVEMENT ───────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ─── RESIZE TILED WINDOWS (hold to repeat) ─────
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40

# ─── WORKSPACES ────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ─── MOVE WINDOW TO WORKSPACE ──────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ─── SYSTEM CONTROLS ───────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ─── SCREENSHOTS ───────────────────────────────
bind = $mainMod SHIFT, S, exec, grimblast copy area
bind = $mainMod CTRL, S, exec, grimblast save screen

# ─── DISPLAY SETTINGS ──────────────────────────
bind = $mainMod, O, exec, wlr-randr

# ─── SYSTEM ────────────────────────────────────
bind = $mainMod, L, exec, swaylock
bind = $mainMod SHIFT, E, exit

# ─── DASHBOARD / EXTRAS ────────────────────────
bind = $mainMod, V, exec, eww open dashboard
bind = $mainMod, C, exec, kitty --class cheatsheet -e nvim +HyprCheat
bind = SUPER, D, exec, ags toggle dashboard

# Quickshell Workspace Overview
bind = SUPER, Tab, exec, ~/.config/hypr/quickshell/modules/overview/toggle.sh