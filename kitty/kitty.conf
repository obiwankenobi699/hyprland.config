# ── Window ────────────────────────────────────────────────────
confirm_os_window_close 0
background_opacity      0.7

# ── Font ──────────────────────────────────────────────────────
font_family      JetBrains Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13

# ── Cursor ────────────────────────────────────────────────────
cursor_shape     block
cursor_blink_interval 0
cursor           #fb4934
cursor_text_color #1d2021

# Ninja-like cursor trail
cursor_trail                1
cursor_trail_decay          0.05 0.2
cursor_trail_start_threshold 1

# ── Performance ───────────────────────────────────────────────
repaint_delay   5
input_delay     1
sync_to_monitor yes

# ── Mouse ─────────────────────────────────────────────────────
mouse_hide_wait 3.0

# ── Scrollback ────────────────────────────────────────────────
scrollback_lines         5000
clear_scrollback_on_clear yes

# ── Clipboard ─────────────────────────────────────────────────
# write-clipboard  : lets nvim, tmux, and other apps write to clipboard
# write-primary    : populates primary selection (middle-click paste)
# read-*-ask       : kitty asks before any app reads your clipboard
clipboard_control  write-clipboard write-primary read-clipboard-ask read-primary-ask
copy_on_select     yes
strip_trailing_spaces smart

# Confirm before pasting large blocks; quote URLs so they paste safely
paste_actions quote-urls-at-prompt,confirm-if-large

# ── Remote control ────────────────────────────────────────────
allow_remote_control yes

# ── Bell ──────────────────────────────────────────────────────
enable_audio_bell no

# ── URLs ──────────────────────────────────────────────────────
url_style dashed

# ── Keybinds ──────────────────────────────────────────────────
# Ctrl+Shift+Delete — wipe visible screen AND full scrollback.
# After this fires the Quickshell overview tile for this window goes blank.
map ctrl+shift+delete clear_terminal scrollback active

# ── Theme ─────────────────────────────────────────────────────
# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME