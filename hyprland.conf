autogenerated = 0

# Core variables
source = ~/.config/hypr/variables.conf

# Monitors first (VERY IMPORTANT)
source = ~/.config/hypr/monitors.conf

# Autostart MUST be early
source = ~/.config/hypr/autostart.conf

# Interaction & rules
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf


# MINIMAL - wallpaper only (no daemon overhead)
# 2s total - daemonless (works on reboot)

# Run battery notification script every 60 seconds
# Run battery notification script every 60 seconds
windowrulev2 = opacity 0.8 0.8,class:^(org.gnome.Nautilus)$


# General gaps
general {
    gaps_in = 5        # gaps between windows
    gaps_out = 10      # gaps between windows and screen edge
    border_size = 2    # window border thickness
    col.active_border = rgb(ffb86c) rgb(8be9fd) 45deg
    col.inactive_border = rgba(44444488)
}


decoration {
    rounding = 10
    active_opacity = 0.9
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        color = rgba(26,26,26,0.7)
    }
    blur {
        enabled = false
    }
}



animations {
    enabled = yes, please :)
}






