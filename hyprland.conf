autogenerated = 0

source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(b8bb26cc)
    col.inactive_border = rgba(665c5488)
    resize_on_border = true
    extend_border_grab_area = 15  # adds grab area beyond the visible border
}


decoration {
    rounding = 10
    active_opacity = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.10
    shadow {
        enabled = true
        range = 4
        color = rgba(26,26,26,0.7)
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = true
}

dwindle {
    pseudotile = true
    preserve_split = true
    split_width_multiplier = 1.3
}

master {
    new_on_top = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
}
gestures {
    gesture = 3, horizontal, workspace
}
    gesture = 3, up, dispatcher, exec, ~/.config/hypr/quickshell/modules/overview/toggle.sh
