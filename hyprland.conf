autogenerated = 0

source = ~/.config/hypr/env.conf
source = ~/.config/hypr/variables.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf

# ── General ───────────────────────────────────────────────
general {
    gaps_in  = 6
    gaps_out = 12
    border_size = 2

    # Animated gruvbox gradient (green -> aqua -> orange) on the focused window
    col.active_border   = rgba(b8bb26ff) rgba(83a598ff) rgba(fe8019ff) 45deg
    col.inactive_border = rgba(665c5488)

    resize_on_border        = true
    extend_border_grab_area = 15

    allow_tearing = true   # low-latency tearing for games (per-window via windowrules)
}

# ── Decoration ────────────────────────────────────────────
decoration {
    rounding         = 10
    active_opacity   = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.10

    shadow {
        enabled = true
        range   = 4
        color   = rgba(26,26,26,0.7)
    }

    blur {
        enabled = false   # global blur off — keeps windows transparent (not frosted)
    }
}

# ── Animations ────────────────────────────────────────────
animations {
    enabled = true
    # Slowly rotate the gradient border on the focused window (window anims stay default)
    animation = borderangle, 1, 60, default, loop
}

# ── Dwindle Layout ────────────────────────────────────────
dwindle {
    preserve_split         = true
    split_width_multiplier = 1.3
}

# ── Master Layout ─────────────────────────────────────────
master {
    new_on_top = true
}

# ── Misc ──────────────────────────────────────────────────
misc {
    disable_hyprland_logo    = true
    disable_splash_rendering = true
    mouse_move_enables_dpms  = true
    focus_on_activate        = true
}

# ── Debug ─────────────────────────────────────────────────
debug {
    vfr = true   # variable refresh: idle frames cost ~0 GPU
}

# ── Gestures ──────────────────────────────────────────────
gestures {
    gesture = 3, horizontal, workspace
    gesture = 3, up, dispatcher, exec, ~/.config/hypr/quickshell/modules/overview/toggle.sh
}
