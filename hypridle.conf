general {
    lock_cmd = pidof hyprlock || hyprlock       # prevent duplicate locks
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # wake screen after resume
    ignore_dbus_inhibit = false                 # respect fullscreen / media inhibit
}

# ── 5 min idle → lock ──────────────────────────────────
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ── 5m30s idle → screen off ───────────────────────────
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
