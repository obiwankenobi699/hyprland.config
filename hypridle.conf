general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# ── 1h idle → lock only ────────────────────────────────
# No dpms/backlight blanking on idle: the Intel i915 panel-self-refresh
# can't re-power the panel on this laptop, so any screen-off hard-freezes
# the display (full shutdown required). We only lock — the panel stays on.
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}
