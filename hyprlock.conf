general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# ── Clock ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = Sans

    position = 0, 160
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.6)
    font_size = 18
    font_family = Sans

    position = 0, 80
    halign = center
    valign = center
}

# ── Username ───────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 22
    font_family = Sans

    position = 0, 10
    halign = center
    valign = center
}

# ── Password Input ─────────────────────────────────────
input-field {
    monitor =
    size = 260, 52
    outline_thickness = 2

    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true

    outer_color = rgb(151515)
    inner_color = rgb(101010)
    font_color = rgb(ffffff)
    check_color = rgb(00ff99)
    fail_color = rgb(ff5555)
    fail_text = <i>Auth failed</i>

    fade_on_empty = false
    rounding = 12

    placeholder_text = Password...
    hide_input = false

    position = 0, -80
    halign = center
    valign = center
}
