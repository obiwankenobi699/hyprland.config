general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0200
    contrast = 1.1000
    brightness = 0.7500
    vibrancy = 0.1500
    vibrancy_darkness = 0.0
}

# ── Clock ──────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(220, 240, 230, 0.92)
    font_size = 88
    font_family = Noto Serif

    position = 0, 170
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d" | tr '[:lower:]' '[:upper:]')"
    color = rgba(160, 210, 185, 0.55)
    font_size = 11
    font_family = Noto Sans Mono

    position = 0, 82
    halign = center
    valign = center
}

# ── Username ───────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(160, 210, 185, 0.60)
    font_size = 13
    font_family = Noto Sans Mono

    position = 0, 18
    halign = center
    valign = center
}

# ── Password Input ─────────────────────────────────────
input-field {
    monitor =
    size = 240, 48

    outline_thickness = 1
    dots_size = 0.20
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(29, 158, 117, 0.25)
    inner_color = rgba(10, 22, 18, 0.75)
    font_color = rgba(200, 235, 215, 0.85)
    check_color = rgba(29, 158, 117, 0.80)
    fail_color = rgba(220, 80, 80, 0.80)
    fail_text = auth failed

    fade_on_empty = false
    rounding = 8

    placeholder_text = enter password
    placeholder_color = rgba(120, 170, 145, 0.35)
    hide_input = false

    position = 0, -60
    halign = center
    valign = center
}
