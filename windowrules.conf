
# -----------------------------------------------------
# FILE MANAGERS
# -----------------------------------------------------

# Nautilus (GNOME)
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.85 0.85

# Dolphin (KDE)
windowrule = match:class ^(org.kde.dolphin)$, opacity 0.9 0.9


# -----------------------------------------------------
# TERMINALS
# -----------------------------------------------------

# Kitty terminal
windowrule = match:class ^(kitty)$, opacity 1.0 0.9
windowrule = match:class ^(kitty)$, rounding 10


# -----------------------------------------------------
# CODE / EDITORS
# -----------------------------------------------------

# VS Code OSS
windowrule = match:class ^(code-oss)$, opacity 1.0 1.0


# -----------------------------------------------------
# BROWSERS
# -----------------------------------------------------

# Brave
windowrule = match:class ^(brave-browser)$, opacity 1.0 1.0


# -----------------------------------------------------
# FLOATING UTILITIES
# -----------------------------------------------------

# Pavucontrol
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(pavucontrol)$, center on

# Blueman
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(blueman-manager)$, center on


# -----------------------------------------------------
# FULLSCREEN BEHAVIOR
# -----------------------------------------------------

# Fullscreen windows: keep full opacity
windowrule = match:fullscreen 1, opacity 1.0 1.0
 

  
