# ── Claude cockpit — tmux config ────────────────────────────
# Repo:   ~/.config/hypr/tmux/tmux.conf
# Symlink: ~/.config/tmux/tmux.conf  (tmux reads it on start / prefix+R)
# Keeps tmux defaults (prefix = C-b, panes 0-indexed so cc-tmux.sh works).

set -g mouse on
set -sg escape-time 10          # snappier ESC in nvim
set -g history-limit 20000
set -g renumber-windows on

# ── Cockpit popups (in-terminal, no wofi) ───────────────────
# Mission Control — Spotlight-style palette, NO prefix (Alt+Space)
bind -n M-Space display-popup -E -w 70% -h 70% "~/.config/hypr/scripts/cc-mission.sh"

# Big readable lazygit on demand (prefix + g) — replaces the cramped pane
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# AI review queue — step through Claude's changes with delta (prefix + r)
bind r display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "~/.config/hypr/scripts/cc-review.sh"

# Reload config (prefix + R)
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# ── Gruvbox Dark Hard status bar ────────────────────────────
set -g status-style "bg=#1d2021,fg=#a89984"
set -g status-left  "#[bg=#fe8019,fg=#1d2021,bold] #S #[bg=#1d2021,fg=#fe8019]#[default] "
set -g status-left-length 30
set -g status-right "#[fg=#83a598]#{pane_current_path}#[fg=#665c54]  ·  #[fg=#fabd2f]%H:%M "
set -g status-right-length 90
setw -g window-status-current-style "fg=#b8bb26,bold"
setw -g window-status-style "fg=#665c54"
set -g message-style "bg=#1d2021,fg=#fabd2f"

# ── Clear pane separation + labeled headers ─────────────────
set -g pane-border-lines "heavy"                 # thicker, visible dividers
set -g pane-border-style "fg=#665c54"            # inactive: readable, not invisible
set -g pane-active-border-style "fg=#fe8019,bold"
set -g pane-border-status top                     # a labeled header bar per pane
set -g pane-border-format " #{?pane_active,#[fg=#fe8019#,bold],#[fg=#928374]}#{pane_title} #[default]#{?window_zoomed_flag,#[fg=#fabd2f][Z] ,}"
